name: Release & Docker

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required: create GitHub Release
      packages: write   # required: push to ghcr.io

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Unit Tests
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew testDebugUnitTest

      - name: Build Android Client APK
        run: |
          chmod +x android/gradlew
          cd android
          
          # Parse version name from tag (e.g. v1.0.8-android -> 1.0.8)
          TAG_NAME="${{ github.ref_name }}"
          VERSION_NAME=$(echo "$TAG_NAME" | sed -E 's/v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          
          # Calculate version code from version name (e.g. 1.0.8 -> 10008)
          MAJOR=$(echo "$VERSION_NAME" | cut -d. -f1)
          MINOR=$(echo "$VERSION_NAME" | cut -d. -f2)
          PATCH=$(echo "$VERSION_NAME" | cut -d. -f3)
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          
          # Fallback if parsing fails
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION_NAME="1.0.8"
            VERSION_CODE=8
          fi
          
          echo "Building version $VERSION_NAME ($VERSION_CODE)"
          
          ANDROID_VERSION_NAME="$VERSION_NAME" ANDROID_VERSION_CODE="$VERSION_CODE" ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../hermes-client-android-debug.apk

      # Create GitHub Release from tag with auto-generated notes and attach APK
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: hermes-client-android-debug.apk

      # Set up multi-arch build (QEMU + Buildx)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Log in to GitHub Container Registry
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Extract tags from the git ref (supports vX.Y and vX.Y.Z formats)
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=match,pattern=v(\d+\.\d+(?:\.\d+)?),group=1
            type=raw,value=latest

      # Build and push multi-arch image (amd64 + arm64)
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: HERMES_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
